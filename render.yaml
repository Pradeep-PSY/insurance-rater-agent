databases:
  - name: insurance-rater-db
    plan: basic-256mb
    databaseName: insurance_rater
    user: insurance_rater
    postgresMajorVersion: "17"

services:
  - type: web
    name: insurance-rater-reviewer
    runtime: docker
    plan: starter
    dockerContext: ./apps/service
    dockerfilePath: ./apps/service/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insurance-rater-db
          property: connectionString
      - key: REVIEWER_ACCESS_TOKEN
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: WORKSPACE_ID
        value: shared-reviewer
      - key: OCR_PROVIDER
        value: disabled
      - key: POLICY_FACT_PROVIDER
        value: disabled
  - type: worker
    name: insurance-rater-worker
    runtime: docker
    plan: starter
    dockerContext: ./apps/service
    dockerfilePath: ./apps/service/Dockerfile
    dockerCommand: npm run start:worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insurance-rater-db
          property: connectionString
      - key: REVIEWER_ACCESS_TOKEN
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: WORKSPACE_ID
        value: shared-reviewer
      - key: OCR_PROVIDER
        value: disabled
      - key: POLICY_FACT_PROVIDER
        value: disabled
